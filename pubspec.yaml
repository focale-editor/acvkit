name: acvkit
description: A pure Dart codec for Adobe Photoshop ACV curves files.
version: 0.2.0
homepage: https://github.com/focale-editor/acvkit
repository: https://github.com/focale-editor/acvkit

topics:
  - photoshop
  - color
  - image-processing
  - codec
  - file-format

screenshots:
  - description: 'A flat illustration of ACV tone-curve decoding and encoding.'
    path: screenshots/overview.png

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  pscore: '>=0.1.4 <0.2.0'

dev_dependencies:
  checks: ^0.3.2
  lints: ^6.1.0
  release: ^0.1.11
  test: ^1.32.0

release:
  changelog:
    header: '# 📰 AcvKit changelog'
    defaultIgnoredTypes: ['test']
    defaultIgnoredScopes: ['repo', 'docs', 'version', 'deps', 'tools']
